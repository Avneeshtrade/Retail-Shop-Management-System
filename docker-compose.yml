services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: retailshop
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/retailshop
      DB_USERNAME: retail
      DB_PASSWORD: retail
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET to a random string of 32+ characters}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      APP_CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
